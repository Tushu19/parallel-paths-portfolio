<svg width="40" height="50" viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shipBodyActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="glowActive">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Large outer flame -->
  <ellipse cx="20" cy="36" rx="7" ry="12" fill="url(#flameOuter)" opacity="0.9" filter="url(#glowActive)">
    <animate attributeName="ry" values="12;14;12" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="0.3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Medium inner flame -->
  <ellipse cx="20" cy="35" rx="5" ry="9" fill="url(#flameInner)" opacity="0.95" filter="url(#glowActive)">
    <animate attributeName="ry" values="9;10;9" dur="0.25s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Bright core -->
  <ellipse cx="20" cy="33" rx="3" ry="6" fill="#fef3c7" opacity="1">
    <animate attributeName="opacity" values="1;0.8;1" dur="0.2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Spaceship body (rocket shape) -->
  <path d="M20 8 L26 20 L24 20 L24 28 L16 28 L16 20 L14 20 Z" 
        fill="url(#shipBodyActive)" 
        stroke="#fff" 
        stroke-width="1.5" 
        filter="url(#glowActive)"/>
  
  <!-- Nose cone -->
  <path d="M20 4 L24 8 L16 8 Z" fill="#e0e7ff" stroke="#fff" stroke-width="1"/>
  
  <!-- Cockpit window (brighter when active) -->
  <circle cx="20" cy="14" r="2.5" fill="#60a5fa" opacity="1" stroke="#fff" stroke-width="0.5">
    <animate attributeName="opacity" values="1;0.7;1" dur="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Wing details -->
  <rect x="14" y="20" width="2" height="4" fill="#6366f1" opacity="0.9"/>
  <rect x="24" y="20" width="2" height="4" fill="#6366f1" opacity="0.9"/>
  
  <!-- Engine nozzles -->
  <rect x="17" y="28" width="2.5" height="2" fill="#312e81" rx="0.5"/>
  <rect x="20.5" y="28" width="2.5" height="2" fill="#312e81" rx="0.5"/>
</svg>
