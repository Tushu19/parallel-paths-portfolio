<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(280, 90%, 65%);stop-opacity:1" />
      <stop offset="50%" style="stop-color:hsl(200, 95%, 60%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(165, 90%, 55%);stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="62" fill="#0a0a0f" stroke="url(#cosmicGrad)" stroke-width="2"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#cosmicGrad)" stroke-width="1" opacity="0.3"/>
  <text x="64" y="80" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="url(#cosmicGrad)" filter="url(#glow)">TG</text>
  <circle cx="32" cy="32" r="2" fill="hsl(165, 90%, 55%)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="32" r="2" fill="hsl(200, 95%, 60%)" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="96" r="2" fill="hsl(280, 90%, 65%)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
