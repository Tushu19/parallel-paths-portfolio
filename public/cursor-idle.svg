<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shipBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Idle flame (small) -->
  <ellipse cx="20" cy="32" rx="4" ry="6" fill="url(#flame)" opacity="0.7" filter="url(#glow)">
    <animate attributeName="ry" values="6;7;6" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Spaceship body (rocket shape) -->
  <path d="M20 8 L26 20 L24 20 L24 28 L16 28 L16 20 L14 20 Z" 
        fill="url(#shipBody)" 
        stroke="#fff" 
        stroke-width="1.5" 
        filter="url(#glow)"/>
  
  <!-- Nose cone -->
  <path d="M20 4 L24 8 L16 8 Z" fill="#e0e7ff" stroke="#fff" stroke-width="1"/>
  
  <!-- Cockpit window -->
  <circle cx="20" cy="14" r="2.5" fill="#60a5fa" opacity="0.9" stroke="#fff" stroke-width="0.5"/>
  
  <!-- Wing details -->
  <rect x="14" y="20" width="2" height="4" fill="#6366f1" opacity="0.8"/>
  <rect x="24" y="20" width="2" height="4" fill="#6366f1" opacity="0.8"/>
  
  <!-- Engine nozzles -->
  <rect x="17" y="28" width="2.5" height="2" fill="#312e81" rx="0.5"/>
  <rect x="20.5" y="28" width="2.5" height="2" fill="#312e81" rx="0.5"/>
</svg>
