<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Spaceship body -->
  <path d="M16 4 L20 12 L18 12 L18 20 L14 20 L14 12 L12 12 Z" fill="url(#shipGrad)" filter="url(#glow)" stroke="#fff" stroke-width="0.5"/>
  <!-- Cockpit window -->
  <circle cx="16" cy="10" r="1.5" fill="#60a5fa" opacity="0.8"/>
  <!-- Small idle thrust -->
  <ellipse cx="16" cy="21" rx="2" ry="3" fill="#fbbf24" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="0.8s" repeatCount="indefinite"/>
  </ellipse>
</svg>
